; Optional. Place next to mdlite.exe. The EXE works without this file.
; UTF-8, #RRGGBB colors. Missing or invalid entries use built-in defaults.
;
; Every section except [viewer] is a palette, named by the section. Add your
; own by adding a section: it appears in Options and in Settings straight away.
; A palette may list only the roles it wants to change.
;
; Options > Settings (Ctrl+,) adds palettes and edits the current one, writing
; it back here and touching only that section plus the [viewer] keys. Ctrl+D
; steps through the palettes; Ctrl+F5 rereads this file.

[viewer]
theme=Dark
; auto (default) picks a pipeline per block: GDI, then GDI+, then Direct2D.
; Pin one with gdi, gdiplus or direct2d. Blocks needing shaping still use
; Direct2D so they stay correct.
renderer=auto
; Animate the wheel, arrows and Page keys instead of jumping. off restores the
; instant scroll. Dragging the scrollbar is never animated.
smooth=on
; Text size as a percentage, 50 to 400. Ctrl with the wheel, Ctrl+plus,
; Ctrl+minus and Ctrl+0, the footer's - 100% + cluster, or the Options menu.
zoom=100
; Show the zoom control floating over the document: the far corner of the text,
; which is the left one when the document itself reads right to left.
floating=on

